/* layout: left sidebar of grouped sections on wide screens, drawer on phones; one reading column of cards */
:root{

  --accent:#0e6a5b; --accent-ink:#ffffff; --accent-soft:#dcefeb; --brass:#8f6410; --warn:#a4491c;

}

  }
}

  color-scheme:dark;
  --bg:#0e1615; --surface:#172221; --sunk:#111b1a; --ink:#e5edeb; --muted:#94a4a0; --line:#2b3b38;

details.qline summary{color:var(--ink)}

.bodycard{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.bodycard>div:last-child{flex:1 1 260px}

.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:8px}
.bpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}.bpk{padding:4px 2px;flex-direction:column;gap:3px;-webkit-tap-highlight-color:rgba(63,185,160,.3);touch-action:manipulation;color:inherit;font:inherit;border:2px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;display:flex;justify-content:center;align-items:center}.bpk img,.bpk canvas,.bpk span{max-width:100%}.bpk>.ic{pointer-events:none}.bpn{pointer-events:none;font-size:11px;line-height:1.2;text-align:center;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}.bpk.on{border-color:var(--accent,#3fb9a0);box-shadow:0 0 0 2px var(--accent,#3fb9a0)}.bsel{display:flex;gap:10px;align-items:center;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}

.stage .lvin{width:110px}
.svgbox{background:var(--sunk);border-radius:12px;padding:8px;display:flex;justify-content:center}
.svgbox svg{max-width:360px;width:100%;height:auto}
.svgbox .nodeg{cursor:pointer}
.more{display:flex;justify-content:center;margin-top:10px}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;z-index:30}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.exg{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:6px}.exr{display:flex;align-items:center;gap:6px;border:1px solid var(--line,#ddd);border-radius:8px;padding:6px 8px;font-size:14px}.exr label{display:flex;align-items:center;gap:6px;flex:1;white-space:normal}.exr input[type=number]{width:64px!important;min-width:0!important;padding:4px;flex:none}.exr label{min-width:0}@media (max-width:600px){.exg{grid-template-columns:1fr!important}}.exl{min-width:0;overflow-wrap:anywhere}.exh{display:block;font-size:11px;color:var(--muted,#888);white-space:normal;line-height:1.25}.exm{display:grid;grid-template-columns:auto 1fr 84px 64px auto;gap:6px;align-items:center}.exm input{width:100%;padding:4px}
.qsum>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px}.qsum>summary::-webkit-details-marker{display:none}.qsum>summary::before{content:"▸";font-size:14px;transition:transform .15s}.qsum[open]>summary::before{transform:rotate(90deg)}
.rank{width:28px;height:28px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-weight:700;font-size:.85rem}.fstat{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--muted)}.fstat b{color:var(--ink);font-weight:600}
.fgrid{display:grid;grid-template-columns:repeat(4,44px);gap:4px}.fgrid span{height:44px;border:1px dashed var(--line);border-radius:8px;display:grid;place-items:center;color:var(--muted)}.fgrid span.on{background:var(--accent);color:var(--accent-ink);border:0;font-weight:700}.setc summary{cursor:pointer}
.plist{display:grid;gap:0}.prow{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.prow:last-child{border-bottom:0}.pico{flex:none}.pbody{flex:1;min-width:0;display:grid;gap:6px}.phead{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.pname{font-weight:700;margin-right:4px}.pmats{display:flex;flex-wrap:wrap;gap:6px}.pmat{display:inline-flex;align-items:center;gap:4px;padding:3px 8px 3px 4px;border:1px solid var(--line);border-radius:999px;font-size:.85rem;text-decoration:none;color:inherit}.pmat b{font-weight:600;color:var(--muted)}
.tdet{display:block}.tdet>summary{cursor:pointer;list-style:none}.tdet>summary::-webkit-details-marker{display:none}.tdet[open]>summary{margin-bottom:8px}
.stepn{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--sunk);font-weight:700;font-size:.85rem}
.side .chip{white-space:normal;max-width:100%;overflow-wrap:anywhere}
.qline summary .ic,.tdet summary .ic,.setc summary .ic{vertical-align:middle;margin-right:6px}.tdet summary{align-items:center}
@keyframes flash{0%{background:var(--brass,#e9c46a)}100%{background:transparent}}.flash{animation:flash 2.5s ease-out}
img.rot{display:block;margin:auto;image-rendering:auto}
.mcl{display:flex;flex-direction:column;gap:3px}table.mt td,table.mt th{white-space:nowrap}table.mt td:has(.mcl){white-space:normal;min-width:180px}.mci{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}.mci .ic{flex:none}table.mt td{vertical-align:top}
.chip.cbm{display:inline-flex;align-items:center;gap:6px;padding-left:4px}.chip.cbm .ic{border-radius:50%}

  <div class="lang" role="group" aria-label="名稱顯示語言">

  </div>

</aside>
<div>
<header class="top"><div class="topin">
  <button type="button" id="menu" aria-label="打開目錄" aria-expanded="false">☰</button>
  <a class="mbrand" href="#home"><img src="img/icon.svg" alt="" width="22" height="22" style="vertical-align:-5px;margin-right:5px;border-radius:5px">巨商百科</a>
  <input id="q" type="search" autocomplete="off" placeholder="搜尋怪物、傭兵、技能、道具、地點…" aria-label="搜尋全站">
</div></header>
<div class="wrap"><main id="app"></main></div>
</div>
</div>
<div id="toast" role="status"></div>
<script>
"use strict";
/* ---------- types ---------- */
const TYPES={
  monsters:{l:'怪物',p:'m',ico:48},
  mercs:{l:'主角・傭兵',p:'u',ro:1,ico:48},
  skills:{l:'技能',p:'s',ro:1},
  items:{l:'道具',p:'i',ico:36},
  places:{l:'地點',p:'p',ico:54},
  npcs:{l:'NPC',p:'n',ico:40},
  quests:{l:'任務',p:'q'},
  combos:{l:'戰鬥組合',p:'c'}};
const TK=Object.keys(TYPES);
const ED=TK.filter(t=>!TYPES[t].ro);
const SV={tw:'台港服',kr:'韓服',gl:'國際服'};
const ELS=['火','水','風','雷','土'];
const CATS=['武器','盔甲','頭盔','手套','腰帶','鞋子','戒指','飾物','寶珠・星宿石','外型裝備','使用道具','消耗品','材料','咒術秘訣','匠人技術','貿易品','工具','付費道具','製作','其他'];
const MCAT=['主角','傭兵','1次將帥','2次將帥','改造將帥','覺醒將帥','傳說將帥','明王','四天王','怪物','轉職怪物','幻獸','凶獸','神獸'];
const FAC={monsters:[['nat','地區'],['zone','地圖區域','nat'],['el','屬性'],['mlv','定類魔法等級'],['grade','階級'],['move','類型']],
  mercs:[['cat','類別'],['job','轉職','cat'],['nat','國家']],skills:[['who','類別'],['ucat','兵種類別'],['calc','傷害公式']],
  items:[['cat','分類'],['sub','細分類','cat']],places:[['region','類型']],combos:[],quests:[['qt','類型'],['lvb','等級']],npcs:[['fn','功能'],['nat','國家']]};
const SORTS={monsters:[['nm','名稱'],['exp','經驗值'],['hp','生命']],mercs:[['nm','名稱'],['base','基本能力']],skills:[['nm','名稱'],['cost','魔力消耗']],quests:[['lv','等級（低至高）',1],['nm','名稱']]};
const D={},BASE={},DBD={},SC={};TK.forEach(k=>{D[k]=new Map();BASE[k]={};DBD[k]=[];});
let baseSrc={},dbSrc={},baseOk=false,ATL={},X={};
const IMGV='20261114d';let SRC={},lang='zh',db=null,user=null,canWrite=null,load='loading',got={},filt={},sortBy={},shown={},draft=null,busy=false,ui={};
const $=s=>document.querySelector(s);
const app=$('#app');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nm=e=>e?(e[lang]||e.zh||e.en||e.ko||'（未命名）'):'（已刪除）';
const alt=e=>['zh','en','ko'].filter(k=>k!==(e[lang]?lang:(e.zh?'zh':e.en?'en':'ko'))&&e[k]).map(k=>e[k]).join(' ・ ');
let ALIAS={};
const find=id=>{id=ALIAS[id]||id;for(const t of TK){if(D[t].has(id))return[t,D[t].get(id)];}return null;};
const get=id=>{const f=find(id);return f?f[1]:null;};
const typeOf=id=>{const f=find(id);return f?f[0]:null;};
const sorted=t=>SC[t+'|'+lang]||(SC[t+'|'+lang]=[...D[t].entries()].sort((a,b)=>{const p=(a[1][lang]?0:1)-(b[1][lang]?0:1);if(p)return p;const x=nm(a[1]),y=nm(b[1]);return x<y?-1:x>y?1:0;}));
const HC=new WeakMap();
const hay=e=>{let h=HC.get(e);if(h==null){h=[e.zh,e.en,e.ko,e.role,e.region,e.cat,...(e.aka||[])].filter(Boolean).join(' ').toLowerCase();HC.set(e,h);}return h;};
const qv=()=>$('#q').value.trim().toLowerCase();
const N=v=>{const n=parseFloat(v);return isFinite(n)?n:0;};
const fmt=n=>(Math.round(n*100)/100).toLocaleString('en-US');
const int=n=>Math.floor(n).toLocaleString('en-US');
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2600);}
const LS={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v;}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
lang=LS.get('gs-lang','zh');if(typeof lang!=='string')lang='zh';
let FAV=LS.get('gs-fav',[]),RECENT=LS.get('gs-recent',[]);
function rebuild(k){if(k==='quests')_qk=null;const m=new Map(Object.entries(BASE[k]));for(const [id,d] of DBD[k]){if(d&&d._del)m.delete(id);else m.set(id,d);}D[k]=m;for(const x in SC)if(x.startsWith(k+'|'))delete SC[x];}

/* ---------- small pieces ---------- */
function icon(e,px,fld){const g=e&&(fld&&e[fld]||e.img||e.face);if(!g||!ATL[g[0]])return'';const [W,H,C]=ATL[g[0]],k=px/W,x=(g[1]%C)*W*k,y=Math.floor(g[1]/C)*H*k;
  return`<span class="ic" aria-hidden="true" style="width:${px}px;height:${Math.round(H*k)}px;background-image:url(img/${g[0]}.${ATL[g[0]][4]||'png'}?v=${IMGV});background-size:${W*C*k}px auto;background-position:-${x}px -${y}px"></span>`;}
function svgIcon(e,px,cx,cy){const g=e&&e.img;if(!g||!ATL[g[0]])return'';const [W,H,C,n]=ATL[g[0]];const sx=(g[1]%C)*W,sy=Math.floor(g[1]/C)*H;const rows=Math.ceil((n||C)/C);
  return`<svg x="${cx-px/2}" y="${cy-px/2}" width="${px}" height="${px}" viewBox="${sx} ${sy} ${W} ${H}" style="pointer-events:none" overflow="hidden"><image href="img/${g[0]}.${ATL[g[0]][4]||'png'}?v=${IMGV}" x="0" y="0" width="${W*C}" height="${H*rows}"/></svg>`;}
const icoPx=(t,e)=>{if(!e)return 0;if((t==='mercs'||t==='monsters')&&e.face)return 44;if(!e.img)return 0;const s=e.img[0];return /^(mon|merc)/.test(s)?48:/^map/.test(s)?54:/^npc/.test(s)?40:/^sk/.test(s)?34:36;};
const elChip=el=>el?`<span class="chip el el-${esc(el)}">${esc(el)}</span>`:'';
const chip=(s,c)=>s==null||s===''?'':`<span class="chip${c?' '+c:''}">${esc(s)}</span>`;
const svChips=e=>(e.sv||[]).map(s=>chip(SV[s]||s)).join('');
function row(id,side,subExtra){const e=get(id);if(!e)return`<div class="row"><span class="nm muted">（已刪除嘅資料）</span></div>`;
  const a=alt(e);const sub=[a,subExtra].filter(Boolean).join(' ｜ ');const t=typeOf(id);
  return`<a class="row" href="#${esc(id)}">${icon(e,icoPx(t,e),t==='mercs'||t==='monsters'?'face':null)}<span class="nm">${esc(nm(e))}${sub?`<span class="sub">${esc(sub)}</span>`:''}</span><span class="side">${side||''}</span></a>`;}
const placeNames=ids=>(ids||[]).map(p=>nm(get(p))).join('、');
function srcHtml(e){if(!e.src)return'';const s=SRC[e.src];
  if(s&&s.url)return`<p class="small muted" style="margin:0">資料來源：<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title||s.url)}</a></p>`;
  if(s&&s.title)return`<p class="small muted" style="margin:0">資料來源：${esc(s.title)}</p>`;
  if(/^https?:\/\//.test(e.src))return`<p class="small muted" style="margin:0">資料來源：<a href="${esc(e.src)}" target="_blank" rel="noopener">${esc(e.src)}</a></p>`;
  return`<p class="small muted" style="margin:0">資料來源：${esc(e.src)}</p>`;}
const section=(title,body,extra)=>body?`<section class="card"${extra||''}><h2>${title}</h2>${body}</section>`:'';
const rows=a=>a.length?`<div class="rows">${a.join('')}</div>`:'';
const crumb=parts=>`<div class="crumb"><a href="#home">首頁</a>${parts.map(p=>`<span aria-hidden="true">›</span>${p[1]?`<a href="#${p[1]}">${esc(p[0])}</a>`:`<span>${esc(p[0])}</span>`}`).join('')}</div>`;
const statDl=a=>{a=a.filter(x=>x[1]!=null&&x[1]!==''&&x[1]!==0);return a.length?`<dl class="stats">${a.map(x=>`<div><dt>${x[0]}</dt><dd>${esc(x[1])}</dd></div>`).join('')}</dl>`:'';};
function faceOf(e){const m=e&&String(e.desc||'').match(/可兌換\s*([\d.]+)\s*(億|萬)?兩/);return m?Math.round(+m[1]*(m[2]==='億'?1e8:m[2]==='萬'?1e4:1)):0;}
// craft fee written in item text (NPC / village / 手續費); profession fees come from X.pro
function craftFee(e){if(e&&e.cfee!=null)return N(e.cfee);const s=String(e&&e.note||'')+'\n'+String(e&&e.desc||''),U=m=>Math.round(+m[1].replace(/,/g,'')*(m[2]==='億'?1e8:m[2]==='萬'?1e4:1));let m=s.match(/(?<!學習|製造)費用\s*([\d,.]+)\s*(萬|億)?兩/)||s.match(/手續費\s*([\d,.]+)\s*(萬|億)?/)||s.match(/[、（(]\s*([\d,.]+)\s*(萬|億)?兩\s*[、，)）]/);return m?U(m):0;}
function itemInfo(e){const L=(e.desc||'').split('\n');const txt=[],get_=[],kv=[];let kind='';
  L.forEach(l=>{if(!l.trim())return;if(/^取得：/.test(l)){get_.push(l.slice(3));return;}
    if(l.includes('｜')&&/\d/.test(l)){const p=l.split('｜');if(!/\d/.test(p[0])){kind=p.shift();}p.forEach(x=>{const m=x.trim().match(/^(.*?)\s*(-?[\d.,]+)$/);if(m)kv.push([m[1],m[2]]);else if(x.trim())kv.push([x.trim(),'']);});return;}
    txt.push(l);});
  const g=k=>{const i=kv.findIndex(x=>x[0]===k);if(i<0)return null;const v=kv[i][1];kv.splice(i,1);return v;};
  const mn=g('最小攻擊'),mx=g('最大攻擊');const st=[];if(mn!=null||mx!=null)st.push(['攻擊',mn===mx?mn:`${mn||0}–${mx||0}`]);
  const ORD=['攻擊','防禦','打擊抵抗','法術抵抗','力量','敏捷','體力','智力','生命上限','魔力上限','需求等級'];
  ORD.forEach(k=>{const v=g(k);if(v!=null)st.push([k==='攻擊'?'攻擊力':k,v]);});
  const q=e.eq||{};if(q.el)st.push(['屬性',`${q.el} +${q.ea}`]);if(q.rd)st.push(['特殊效果',q.rd==='p'?'降低打擊抵抗':'降低法術抵抗']);
  const pr=g('價格'),wt=g('重量'),fv=faceOf(e);kv.forEach(x=>st.push(x));
  if(pr!=null){const v=Number(String(pr).replace(/,/g,'')),W=x=>lang!=='en'&&x>=1e8&&x%1e6===0?(x/1e8).toLocaleString('en-US',{maximumFractionDigits:2})+' 億兩':lang!=='en'&&x>=10000?(x/10000).toLocaleString('en-US',{maximumFractionDigits:1})+' 萬兩':x.toLocaleString('en-US')+' 兩';if(fv)st.push(['面值',W(fv)]);else{st.push(['基本價格',W(v)]);if(v>0)st.push(['賣 NPC',W(Math.floor(v/3))]);}}if(wt!=null)st.push(['重量',wt]);
  const only=q.only&&get('gu'+q.only);
  const body=(txt.length?`<p class="pre" style="margin:0">${esc(txt.join('\n'))}</p>`:'')+(st.length?`<div style="margin-top:${txt.length?12:0}px"><div class="flabel">能力</div><dl class="stats">${st.map(x=>`<div><dt>${esc(x[0])}</dt><dd>${esc(x[1])}</dd></div>`).join('')}</dl></div>`:'')
    +(only?`<p class="small" style="margin:10px 0 0">專用：<a href="#gu${esc(q.only)}">${esc(nm(only))}</a></p>`:'')
    +(e.affix?`<p class="small" style="margin:10px 0 0">詞綴 <b>${affLink(e.affix.n)}</b>（${e.affix.g} 級）：${e.affix.st.map(([k,v])=>esc(k)+' +'+v).join('、')}，已經計埋喺上面能力。${e.gsn?`磨練大成功會變成 ${affLink(e.gsn)}。`:''}<a href="#ench">咒術磨練（鬼道）›</a></p>`:'')
    +(e.wsk&&get(e.wsk)?(()=>{const w=get(e.wsk);return`<div style="margin-top:12px"><div class="flabel">武器技能（裝備咗就可以用）</div><div class="rows">${row(e.wsk,w.f?chip('可計傷害','hot'):'',[w.cost?`魔力 ${w.cost}`:'',w.range?`射程 ${w.range} 格`:''].filter(Boolean).join('｜'))}</div>${TXT(w.mdesc)||TXT(w.desc)?`<p class="pre small" style="margin:6px 0 0">${esc(TXT(w.mdesc)||TXT(w.desc))}</p>`:''}${tfHtml(w)}</div>`;})():'')
    +(q.wt?`<p class="small" style="margin:10px 0 0">武器類型：${esc(q.wt)}（用${esc(q.wt)}嘅傭兵先裝得）</p>`:'')
    +(get_.length?`<div style="margin-top:12px"><div class="flabel">取得方法</div>${get_.map(x=>`<p class="pre small" style="margin:0 0 4px">${esc(x)}</p>`).join('')}</div>`:'');
  return section('說明',body);}
const qty=(arr)=>(arr||[]).map(d=>`${nm(get(d.i||d[0]))}×${d.q||d[1]}`).join('、');

/* ---------- reverse lookups ---------- */
const droppedBy=i=>sorted('monsters').filter(([,m])=>(m.drops||[]).some(d=>d.i===i));
const usedInItems=i=>sorted('items').filter(([,x])=>(x.recipe||[]).some(d=>d.i===i));
const questsNeed=i=>sorted('quests').filter(([,x])=>(x.need||[]).some(d=>d.i===i));
const questsGive=i=>sorted('quests').filter(([,x])=>(x.reward||[]).some(d=>d.i===i));
const PRO_L={smith:'鍛造',alchemy:'煉金',jewelry:'珠寶',herb:'採藥',ore:'採礦'};
const proOf=i=>{const r=[];if(!X.pro)return r;for(const k of ['smith','alchemy','jewelry'])for(const p of X.pro[k])if(p.it===i)r.push([k,p]);return r;};
const proUse=i=>{const r=[];if(!X.pro)return r;for(const k of ['smith','alchemy','jewelry'])for(const p of X.pro[k])if(p.m.some(m=>m[0]===i))r.push([k,p]);return r;};
const proGather=i=>{const r=[];if(!X.pro)return r;for(const k of ['herb','ore'])for(const p of X.pro[k])if(p.it===i)r.push([k,p]);return r;};

/* ---------- favourites & recent ---------- */
function visit(id){RECENT=[id,...RECENT.filter(x=>x!==id)].slice(0,12);LS.set('gs-recent',RECENT);}
const isFav=id=>FAV.includes(id);
function toggleFav(id){FAV=isFav(id)?FAV.filter(x=>x!==id):[id,...FAV];LS.set('gs-fav',FAV);}

/* ---------- navigation ---------- */
const NAVG=[
 ['開始',[['home','首頁'],['fresh','最新更新'],['fav','收藏']]],
 ['圖鑑',[['monsters','怪物'],['mercs','主角・傭兵'],['spirits','精靈'],['skills','技能'],['items','道具'],['npcs','NPC']]],
 ['世界同地圖',[['places','地點'],['towns','城鎮'],['combos','戰鬥組合'],['tmap','藏寶圖'],['x-ggh','考古學'],['x-ordeal','試煉地下城'],['x-begin','新手村']]],

/* ---------- quest flow ---------- */
let _qk=null;
function qKids(){if(_qk)return _qk;_qk={};for(const [id,q] of D.quests){if(q.pre&&D.quests.has(q.pre))(_qk[q.pre]=_qk[q.pre]||[]).push(id);}
  for(const k in _qk)_qk[k].sort((a,b)=>N(get(a).lv)-N(get(b).lv));return _qk;}
function qPath(id){const p=[id];let q=get(id),g=0;while(q&&q.pre&&D.quests.has(q.pre)&&!p.includes(q.pre)&&g++<200){p.unshift(q.pre);q=get(q.pre);}return p;}
function qSize(id,seen){seen=seen||new Set();if(seen.has(id))return 0;seen.add(id);return 1+(qKids()[id]||[]).reduce((a,k)=>a+qSize(k,seen),0);}
function qLvRange(id){let lo=1e9,hi=0;const walk=(x,s)=>{if(s.has(x))return;s.add(x);const q=get(x);if(q&&q.lv){lo=Math.min(lo,q.lv);hi=Math.max(hi,q.lv);}(qKids()[x]||[]).forEach(k=>walk(k,s));};walk(id,new Set());return hi?(lo===hi?`Lv ${lo}`:`Lv ${lo}–${hi}`):'';}
function qStep(id,me,n){const q=get(id);return`<a class="qstep${id===me?' me':''}" href="#${esc(id)}"><span class="qn">${n}</span><span class="nm">${esc(nm(q))}<span class="sub">${[q.lv?'Lv '+q.lv:'',q.npc?nm(get(q.npc)):'',q.task?(q.task[lang==='en'?'en':'zh']||q.task.zh||''):''].filter(Boolean).map(esc).join('｜')}</span></span></a>`;}
function qTree(id,me,n,seen){seen=seen||new Set();if(seen.has(id))return'';seen.add(id);const ks=qKids()[id]||[];
  let h=`<li>${qStep(id,me,n)}`;
  if(ks.length===1)h+=`</li>${qTree(ks[0],me,n+1,seen)}`;
  else if(ks.length>1)h+=`<div class="qbranch small muted">完成後可以揀 ${ks.length} 條路：</div><ul class="qflow sub">${ks.map(k=>qTree(k,me,n+1,seen)).join('')}</ul></li>`;
  else h+='</li>';return h;}
function qAll(root){const out=[];const walk=(x,s)=>{if(s.has(x))return;s.add(x);out.push(x);(qKids()[x]||[]).forEach(k=>walk(k,s));};walk(root,new Set());return out;}
function qSum(ids){const R={kill:{},need:{},reward:{},misc:{}};ids.forEach(qid=>{const q=get(qid);if(!q)return;['kill','need','reward'].forEach(f=>(q[f]||[]).forEach(x=>{if(!get(x.i))return;const r=R[f][x.i]=R[f][x.i]||{n:0,c:0};r.n+=N(x.q)||1;r.c++;}));
    (q.desc||'').split('\n').forEach(l=>{if(!l.startsWith('獎勵：'))return;l.slice(3).split('、').forEach(x=>{const m=x.match(/^(\S+)\s+([\d.]+)/);if(m)R.misc[m[1]]=(R.misc[m[1]]||0)+N(m[2]);});});});return R;}
function qSumHtml(ids){const R=qSum(ids);const blk=(f,l)=>{const a=Object.entries(R[f]).sort((x,y)=>y[1].n-x[1].n);return a.length?`<div><div class="flabel">${l}（${a.length} 種）</div>${rows(a.map(([i,r])=>row(i,chip('×'+r.n.toLocaleString('en-US'),f==='reward'?'hot':'cond')+(r.c>1?chip(r.c+' 個任務'):''))))}</div>`:'';};
  const ms=Object.entries(R.misc);const mh=ms.length?`<div><div class="flabel">獎勵合計</div><dl class="stats">${ms.map(([k,v])=>`<div><dt>${esc(k)}</dt><dd>${int(v)}</dd></div>`).join('')}</dl></div>`:'';
  const h=blk('kill','要擊殺')+blk('need','要交道具')+mh+blk('reward','獎勵道具');return h?`<div style="display:grid;gap:12px">${h}</div>`:'<p class="small muted" style="margin:0">冇需要擊殺、交道具或者獎勵。</p>';}
function questSum(id){const path=qPath(id),all=qAll(path[0]);if(all.length<2)return'';
  const br=(qKids()[path[0]]||[]).length>1||all.some(x=>(qKids()[x]||[]).length>1);
  return`<details class="card qsum"><summary><h2 style="display:inline;margin:0">成條任務線總需求同獎勵（${all.length} 個任務）</h2></summary><div style="margin-top:12px">${qSumHtml(all)}${path.length>1&&path.length<all.length?`<details class="fx" style="margin-top:12px"><summary>只計由第一步做到呢一步（${path.length} 個任務）</summary>${qSumHtml(path)}</details>`:''}${br?'<p class="small muted" style="margin:8px 0 0">任務線有分支，總數計晒所有分支。</p>':''}</div></details>`;}
function questFlow(id){const path=qPath(id),root=path[0],q=get(id),ks=qKids()[id]||[];
  const pre=q.pre&&get(q.pre)?rows([row(q.pre,chip('要先完成','cond'))]):'<p class="small muted" style="margin:0">冇前置任務，夠等級就可以直接接。</p>';
  const next=ks.length?rows(ks.map(k=>row(k,chip('完成後解鎖')+(get(k).lv?chip('Lv '+get(k).lv):'')))):'<p class="small muted" style="margin:0">呢個係任務線最後一步。</p>';
  const total=qSize(root);
  return section('前置同後續',`<div style="display:grid;gap:10px"><div><div class="flabel">前置任務</div>${pre}</div><div><div class="flabel">完成後可以接</div>${next}</div></div>`)
   +(total>1?section(`成條任務線（第 ${path.length} 步，共 ${total} 個任務）`,`<ol class="qflow">${qTree(root,id,1)}</ol>`):'');}
function vQuestLines(){const K=qKids();const q=qv();const qtF=ui.qt||'';
  let roots=sorted('quests').filter(([id,x])=>!(x.pre&&D.quests.has(x.pre))&&K[id]);
  if(qtF)roots=roots.filter(([id,x])=>x.qt===qtF);
  if(q)roots=roots.filter(([id])=>{const s=new Set();const w=x=>{if(s.has(x))return false;s.add(x);return hay(get(x)).includes(q)||(K[x]||[]).some(w);};return w(id);});
  const QR={新手:0,戰鬥:1,商人:2,限時:3,活動:4,週末:5,重複:6};roots.sort((a,b)=>((QR[a[1].qt]??3)-(QR[b[1].qt]??3))||N(a[1].lv)-N(b[1].lv));
  const types=[...new Set([...D.quests.values()].map(x=>x.qt).filter(Boolean))];
  const singles=sorted('quests').filter(([id,x])=>!(x.pre&&D.quests.has(x.pre))&&!K[id]).length;
  return`<div class="tabs" role="group" aria-label="任務類型"><button type="button" data-qt="" aria-pressed="${!qtF}">全部</button>${types.map(t=>`<button type="button" data-qt="${esc(t)}" aria-pressed="${qtF===t}">${esc(t)}</button>`).join('')}</div>
  <p class="small muted" style="margin:0">${roots.length} 條任務線，主線先、重複任務最後，同類由低等級排到高等級。撳開就見到每一步；有分支嘅地方會列出可以揀嘅路。另有 ${singles} 個獨立任務喺「全部任務」。</p>
  ${roots.map(([id,x])=>{const n=qSize(id);return`<details class="fx qline"><summary>${x.npc&&get(x.npc)?icon(get(x.npc),28):''}<b>${esc(nm(x))}</b>　<span class="small">${n} 個任務｜${esc(qLvRange(id))}${x.npc?'｜'+esc(nm(get(x.npc))):''}${x.qt?'｜'+esc(x.qt):''}</span></summary><ol class="qflow">${qTree(id,'',1)}</ol></details>`;}).join('')||'<p class="muted">冇符合嘅任務線。</p>'}`;}
function questDetail(id,e){let b='';
  b+=statDl([['需要等級',e.lv],['類型',e.qt],['重置',e.rep]]);
  b+=questSum(id);

function chainOf(id){const c=[id];let cur=get(id),guard=0;
  while(cur&&guard++<8){const f=(cur.from||[]).find(x=>JOBK.includes(x.k)&&get(x.id));if(!f||c.includes(f.id))break;c.unshift(f.id);cur=get(f.id);}return c;}
function rootOf(id){return chainOf(id)[0];}
function treeHtml(id,me,seen){seen=seen||new Set();if(seen.has(id))return'';seen.add(id);const e=get(id);if(!e)return'';

const TXT=x=>x?(x[lang==='en'?'en':'zh']||x.zh||x.en||''):'';
function mercDetail(id,e){let b='';const s=e.st||{};

const NATS=['朝鮮','台灣','中國','日本','印度'];
function legendNeeds(id){const e=get(id);const mats=(e&&e.from||[]).filter(f=>f.k==='傳說'&&get(f.id));const by={};

function natPlan(ids,start,home,pri){pri=pri||[];const L=ids.map(legendNeeds);const SL=[];

  const all=(1<<L.length)-1;const slotsOf=L.map((_,li)=>SL.map((s,k)=>s.li===li?k:-1).filter(k=>k>=0));
  const MOV=NATS.filter(n=>n!=='印度');
  // 按一個轉國次序模擬：每到一國，做晒可以做嘅材料，齊料就即刻合成
  const sim=(seq,mode)=>{const held=new Set();let done=0;const steps=[];
    for(let vi=0;vi<seq.length;vi++){const nat=seq[vi];const st={n:nat,work:[],made:[]};let ch=true;

      const future=new Set(seq.slice(vi+1));
      const miss=li=>slotsOf[li].filter(k=>!held.has(k)).length;
      const missLater=li=>slotsOf[li].filter(k=>!held.has(k)&&!okN(SL[k])&&!future.has(SL[k].nat)).length;
      while(ch){ch=false;
        L.forEach((x,li)=>{if(done>>li&1)return;if(slotsOf[li].every(k=>held.has(k))){done|=1<<li;slotsOf[li].forEach(k=>held.delete(k));st.made.push(x);ch=true;}});

        for(const l in dem){const c=dem[l].slice().sort((a,b)=>{const A=SL[a].li,Bb=SL[b].li;if(Array.isArray(mode))return mode[A]-mode[Bb];let m=mode;if(m&&typeof m==='object'){const d=m.p[A]-m.p[Bb];if(d)return d;m=m.m;}return m?(missLater(A)-missLater(Bb))||(miss(A)-miss(Bb)):(miss(A)-miss(Bb))||(A-Bb);});
          const k=c[0];held.add(k);st.work.push([SL[k].m,L[SL[k].li].id]);ch=true;}}
      steps.push(st);if(done===all)return steps;}
    return null;};
  const firsts=start&&NATS.includes(start)?[start]:MOV;let best=null;
  let seed=7;const rnd=()=>{seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff;};
  const MODES=[0,1];for(let r=0;r<40;r++){const pr=L.map((_,i)=>i);for(let i=pr.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[pr[i],pr[j]]=[pr[j],pr[i]];}MODES.push(pr);}
  for(let len=1;len<=12&&!best;len++){
    const rec=seq=>{if(best)return;if(seq.length===len){for(const mode of MODES){const r=sim(seq,mode);if(r){best=r;return;}}return;}
      for(const n of MOV){if(n===seq[seq.length-1])continue;rec(seq.concat([n]));if(best)return;}};

  if(!best)return null;let priAt=-1;

  const pAt=st=>{let last=-1;st.forEach((x,i)=>{if(x.made.some(m=>pri.includes(m.id)))last=i;});return last;};
  if(PI.length&&PI.length<L.length){
    // 先計淨係優先嘅傳說將帥要點轉，再喺後面接落去做其他
    const r1=natPlan(PI.map(i=>L[i].id),start,home);const seq1=r1?r1.steps.map(x=>x.n):[];
